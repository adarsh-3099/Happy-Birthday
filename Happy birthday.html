<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy birthday</title>
<meta name="theme-color" content="#f7b8a0">
<meta property="og:title" content="A birthday flight">
<meta property="og:description" content="Something made just for you.">
<script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,400;1,600&family=Figtree:wght@400;500&family=Caveat:wght@500&display=swap">
<style>
:root{
  --paper:#fff8ee; --ink:#2b2140; --muted:#6d6285; --coral:#ff6b4a; --violet:#7a5cd6; --gold:#f4b942; --cream:#fdf3e3;
  --serif:'Fraunces','Georgia',serif; --sans:'Figtree','Segoe UI',system-ui,sans-serif;
  --sky-top:#f7b8a0; --sky-bot:#ffe3b8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#fff8ee;--ink:#2b2140}}
:root[data-theme="dark"]{--paper:#fff8ee;--ink:#2b2140}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--sans);font-size:1.05rem;line-height:1.6;color:var(--ink);background:var(--sky-bot);overflow-x:hidden}
.sky{position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,var(--sky-top),var(--sky-bot))}
.stars{position:fixed;inset:0;z-index:-1;opacity:0;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff}
.cloud{position:fixed;z-index:-1;width:14rem;height:3.4rem;border-radius:999px;background:rgba(255,255,255,.55);filter:blur(6px);pointer-events:none}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.1}

/* hero: boarding pass */
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.2rem 5rem;text-align:center}
.pass{display:grid;grid-template-columns:1fr 6.2rem;width:100%;max-width:34rem;background:var(--paper);border-radius:20px;text-align:left;box-shadow:0 18px 50px rgba(80,40,60,.25);overflow:hidden}
.pass .main{padding:1.6rem 1.5rem}
.pass .stub{border-left:2px dashed rgba(43,33,64,.3);padding:1.2rem .8rem;display:flex;flex-direction:column;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
.pass small{color:var(--muted);display:block}
.pass h1{font-size:clamp(2rem,9vw,3.1rem);margin:.2rem 0 1.2rem;font-style:italic;font-weight:400}
.leg{display:flex;align-items:center;gap:.8rem;font-family:var(--serif);font-size:2.4rem;line-height:1}
.leg svg{flex:0 0 auto;width:2.2rem;color:var(--coral)}
.meta{display:flex;gap:1.6rem;margin-top:1.2rem}
.meta b{display:block;font-weight:500}
.barcode{width:100%;height:3.6rem;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 14px);opacity:.85;border-radius:2px}
.go{margin-top:2.4rem;display:inline-block;color:var(--ink);font-weight:500;text-decoration:none;border-bottom:2px solid var(--ink);padding-bottom:2px}

/* journey */
.journey{position:relative;max-width:62rem;margin:0 auto;padding:6rem 1.2rem 4rem}
#svg{position:absolute;left:0;top:0;width:100%;pointer-events:none;overflow:visible}
#route{fill:none;stroke:rgba(255,255,255,.65);stroke-width:3;stroke-dasharray:2 11;stroke-linecap:round}
#trail{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round}
.dot{fill:rgba(255,255,255,.5);stroke:#fff;stroke-width:3;transition:fill .4s}
.dot.lit{fill:var(--gold)}
.stop{position:relative;min-height:84vh;display:flex;align-items:center;margin-left:24%}
.card{width:100%;background:var(--paper);border-radius:18px;padding:1rem 1rem 1.3rem;box-shadow:0 12px 34px rgba(30,20,60,.22);border-top:5px solid var(--coral)}
.stop.song .card{border-top-color:var(--violet)}.stop.movie .card{border-top-color:var(--gold)}
.js .card{opacity:0;transform:translateY(14px);transition:opacity .7s,transform .7s}
.js .stop.in .card{opacity:1;transform:none}
.photo{aspect-ratio:16/10;border-radius:12px;display:flex;align-items:center;justify-content:center;color:rgba(43,33,64,.6);font-size:.9rem;margin-bottom:.9rem;overflow:hidden;background:linear-gradient(135deg,#ffd9c7,#ffb59b)}
.stop.song .photo{background:linear-gradient(135deg,#d9cdfa,#a898ee)}
.stop.movie .photo{background:linear-gradient(135deg,#fde7b0,#f4c36a)}
.photo img{width:100%;height:100%;object-fit:cover}
.when{display:flex;align-items:center;gap:.5rem;color:var(--muted);font-size:.9rem;margin-bottom:.25rem}
.when svg{width:1.1rem;height:1.1rem;flex:0 0 auto}
.card h3{font-size:1.5rem;margin-bottom:.35rem}
.card p{margin:0}
@media(min-width:760px){
  .journey{padding:7rem 1.5rem 4rem}
  .stop{margin-left:0}
  .stop .card{width:36%}
  .stop.l{justify-content:flex-start}.stop.r{justify-content:flex-end}
  .card{padding:1.1rem 1.1rem 1.4rem}
}
.arrival{position:relative;text-align:center;max-width:36rem;margin:3rem auto 0;background:var(--paper);border-radius:24px;padding:3.2rem 1.6rem 2.4rem;box-shadow:0 18px 50px rgba(10,5,40,.4)}
.arrival h2{font-size:clamp(2rem,8vw,3rem);font-style:italic;font-weight:400;margin-bottom:1rem}
.arrival p{margin:0 auto 1.4rem;max-width:28rem}
.reveal{background:var(--gold);color:var(--ink);border:0;border-radius:999px;padding:.8rem 1.6rem;font:inherit;font-weight:500;cursor:pointer}
.next{display:none;margin-top:1.4rem;padding:1.1rem;border:2px dashed var(--coral);border-radius:14px;font-family:var(--serif);font-size:1.25rem;font-style:italic}
.next.on{display:block}
footer{text-align:center;color:var(--cream);padding:2rem 1rem 3rem;font-size:.9rem;opacity:.85}
:root{--ease:cubic-bezier(.22,.8,.3,1)}
.band{position:fixed;left:0;right:0;bottom:0;height:45vh;z-index:-2;opacity:0;pointer-events:none;background:linear-gradient(0deg,rgba(255,110,70,.6),transparent)}
.orb{position:fixed;z-index:-2;width:5rem;height:5rem;margin:-2.5rem 0 0 -2.5rem;border-radius:50%;pointer-events:none}
.stars i{opacity:.8;animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.pass{animation:drop 1.3s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-28px) rotate(-2deg)}to{opacity:1;transform:none}}
#route{stroke:rgba(255,255,255,.55)}
#trail{stroke:rgba(255,255,255,.95);filter:drop-shadow(0 0 5px rgba(255,255,255,.8))}
#plane{filter:drop-shadow(0 8px 6px rgba(20,10,50,.3))}
.dot.lit{filter:drop-shadow(0 0 8px #f4b942)}
.ring{fill:none;stroke:#f4b942;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring 1.2s var(--ease) forwards}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(3.4);opacity:0}}
.land{fill:rgba(255,255,255,.3)}
.card{position:relative;box-shadow:0 2px 6px rgba(60,30,90,.12),0 20px 44px rgba(60,30,90,.24)}
.js .card{transform:translate(var(--dx,0),18px) rotate(var(--rot,0deg));transition:opacity .8s var(--ease),transform .8s var(--ease),box-shadow .4s}
.stop.l{--dx:-26px;--rot:-1.2deg}.stop.r{--dx:26px;--rot:1.2deg}
.js .stop.in .card{transform:none}
@media(hover:hover){.js .stop.in .card:hover{transform:translateY(-4px);box-shadow:0 4px 10px rgba(60,30,90,.16),0 28px 54px rgba(60,30,90,.3)}}
.card:active{transform:scale(.985)!important}
.photo{aspect-ratio:4/3;overflow:visible;border:7px solid #fff;border-bottom-width:24px;border-radius:3px;box-shadow:0 6px 14px rgba(40,20,70,.22);transform:rotate(-1.6deg);margin:.6rem .1rem 1.2rem;position:relative}
.stop.r .photo{transform:rotate(1.6deg)}
.photo::before{content:"";position:absolute;top:-17px;left:50%;width:74px;height:24px;margin-left:-37px;background:rgba(255,226,150,.72);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.photo img{filter:saturate(1.05) contrast(1.03) sepia(.08)}
.when span{font-family:'Caveat','Segoe Script',cursive;font-size:1.3rem;color:var(--ink)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-left:.2rem}
.eq i{width:3px;height:6px;background:var(--violet);border-radius:1px;animation:eq 1s var(--ease) infinite alternate}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{from{height:3px}to{height:14px}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:0 auto 1.6rem;max-width:26rem}
.stats div{background:rgba(122,92,214,.08);border-radius:12px;padding:.7rem .3rem}
.stats b{display:block;font-family:var(--serif);font-size:1.7rem;font-weight:600}
.stats span{font-size:.8rem;color:var(--muted)}
.js #aText{opacity:0;transition:opacity .6s}
.reveal{animation:pulse 2.4s infinite}
.reveal[aria-expanded=true]{animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(244,185,66,.28)}}
@media(prefers-reduced-motion:reduce){.js .card{opacity:1;transform:none;transition:none}.pass,.reveal,.eq i,.stars i{animation:none}.js #aText{opacity:1}}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="band" id="band" aria-hidden="true"></div>
<div class="orb" id="orb" aria-hidden="true"></div>
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="cloud" id="c1" style="top:14%;left:-4rem" aria-hidden="true"></div>
<div class="cloud" id="c2" style="top:48%;right:-5rem" aria-hidden="true"></div>
<div class="cloud" id="c3" style="top:78%;left:20%" aria-hidden="true"></div>

<header class="hero">
  <div class="pass" role="img" aria-label="Boarding pass for the birthday flight">
    <div class="main">
      <small>Birthday flight</small>
      <h1 id="name">[Her Name]</h1>
      <div class="leg"><span id="from">26</span>
        <svg viewBox="0 0 40 24" fill="currentColor" aria-hidden="true"><path d="M2 12 L38 3 L26 12 L38 21 Z"/></svg>
        <span id="to">25</span></div>
      <div class="meta"><div><small>Date</small><b id="date">[Date]</b></div><div><small>Gate</small><b>Wonder</b></div><div><small>Seat</small><b>1A</b></div></div>
    </div>
    <div class="stub"><span>Admit one</span><div class="barcode"></div><span>Take off</span></div>
  </div>
  <a class="go" href="#journey">Scroll to take off</a>
</header>

<main class="journey" id="journey">
  <svg id="svg" aria-hidden="true">
    <path id="route" d=""/><path id="trail" d=""/>
    <g id="dots"></g>
    <g id="plane"><path d="M-15 -9 L17 0 L-15 9 L-9 0 Z" fill="#fff" stroke="#2b2140" stroke-width="1.4" stroke-linejoin="round"/><path d="M-9 0 L17 0 L-15 9 Z" fill="#e6dccb"/></g>
  </svg>
  <div id="stops"></div>
  <section class="arrival" id="arrival">
    <h2 id="aTitle">Welcome to 25</h2>
    <p id="aText">Write your real message here.</p>
    <div class="stats" id="stats"></div>
    <button class="reveal" id="rev" type="button" aria-expanded="false" aria-controls="next">Reveal the next message</button>
    <div class="next" id="next" role="status"></div>
  </section>
</main>
<footer id="foot">Made with love</footer>

<script>
// ===== EDIT YOUR CONTENT HERE (sample placeholders) =====
var CFG = {
  name: "Shashi", from: 25, to: 26, date: "20/10/2026", me: "[Your name]",
  // type: place | song | movie. Add "img" with a photo (data URI) to replace the placeholder.
  stops: [
    {type:"place", when:"February, 2026", title:"Pachmarhi", img:"https://raw.githubusercontent.com/adarsh-3099/Flappy_bird/refs/heads/main/WhatsApp%20Image%202026-10-14%20at%2000.34.04.jpeg", text:"Our first trip together. The views were beautiful, but your smile is what I remember most."},
    {type:"place", when:"July, 2026", title:"Western Ghats", img:"https://raw.githubusercontent.com/adarsh-3099/Flappy_bird/refs/heads/main/WhatsApp%20Image%202026-10-14%20at%2000.42.00.jpeg",text:"The biggest and the most memorable one. From rains of Matheran, to views of Lonavala and to the sunset at Marine drive, every moment was magical because of you."},
    {type:"place", when:"October, 2026", title:"Netarhat", img:"https://raw.githubusercontent.com/adarsh-3099/Flappy_bird/refs/heads/main/WhatsApp%20Image%202026-10-14%20at%2000.42.35.jpeg", text:"Ever since i bought my bike i always wanted to go on a long ride with you. And we did it, and it was amazing."},
    {type:"movie", when:"Movie night", title:"The Lake House", img:"https://i.pinimg.com/736x/91/86/47/918647a20c2120742a2b81ec4c4383b5.jpg", text:"Movie that reminds me of us. The love which transcends time and distance, well for our long distance relationship, this movie is a perfect fit."},
  ],
  stats: [{n:"3", l:"places"}, {n:"Many", l:"movies"}, {n:"countless", l:"hours of music"}],
  arrivalTitle: "Welcome to 26",
  arrivalText: "Happy birthday my love! I am so grateful for every moment we have shared together, and I look forward to many more adventures with you. You are my everything, and I hope this year brings you as much joy and happiness as you bring to me.",
  nextDestination: `
This year with you has been my favourite. I remember our first trip, and it wasn’t the views, it was your smile. You make ordinary days feel like little adventures, and I’m a better person with you.

I hope this year takes you to every place on your list, and I hope I get to be next to you for as many as I can.

I love you.`,
};
// ========================================================

document.documentElement.classList.add("js");
var $ = function(id){ return document.getElementById(id); };
$("name").textContent = CFG.name; $("from").textContent = CFG.from; $("to").textContent = CFG.to; $("date").textContent = CFG.date;
$("aTitle").textContent = CFG.arrivalTitle; $("aText").textContent = CFG.arrivalText; $("next").textContent = CFG.nextDestination;
$("foot").textContent = "Made with love by your beloved boyfriend.";
$("stats").innerHTML = CFG.stats.map(function(s){ return '<div><b>' + s.n + '</b><span>' + s.l + '</span></div>'; }).join("");

var ICON = {
  place: '<svg viewBox="0 0 24 24" fill="none" stroke="#ff6b4a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.800 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>',
  song: '<svg viewBox="0 0 24 24" fill="none" stroke="#7a5cd6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6.500" cy="18" r="2.500"/><circle cx="17.500" cy="16" r="2.500"/></svg>',
  movie: '<svg viewBox="0 0 24 24" fill="none" stroke="#d99a1e" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="11" rx="1.500"/><path d="M3 9l2-5 4 1-2 5M9 5l4 1-2 5M13 6l4 1-2 5"/></svg>'
};
var wrap = $("stops");
CFG.stops.forEach(function(s, i){
  var d = document.createElement("section");
  d.className = "stop " + s.type + (i % 2 ? " r" : " l");
  d.innerHTML = '<article class="card"><div class="photo">' + (s.img ? '<img alt="" src="' + s.img + '">' : 'Your photo here') + '</div>' +
    '<div class="when">' + ICON[s.type] + '<span>' + s.when + '</span>' + (s.type === "song" ? '<span class="eq"><i></i><i></i><i></i></span>' : '') + '</div><h3>' + s.title + '</h3>' +
    (s.sub ? '<p style="color:var(--muted);margin-bottom:.35rem">' + s.sub + '</p>' : '') + '<p>' + s.text + '</p></article>';
  wrap.appendChild(d);
});

var journey = $("journey"), svg = $("svg"), route = $("route"), trail = $("trail"), plane = $("plane"), dots = $("dots");
var stops = [].slice.call(document.querySelectorAll(".stop")), arrival = $("arrival");
var pts = [], total = 0, H = 0;
var LAND = ['<path d="M0 60L38 8l20 26 16-20 38 46z"/><path d="M96 60l22-30 22 30z"/>', '<path d="M0 60V28h16V10h14v18h10V36h18V20h20v40z"/><path d="M96 60V18h14v42z"/>'];

function build(){
  var W = journey.clientWidth; H = journey.clientHeight;
  var wide = W >= 760 + 48;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.style.height = H + "px";
  pts = [{x: wide ? W * .5 : W * .14, y: 0}];
  stops.forEach(function(s, i){
    var left = s.classList.contains("l");
    pts.push({x: wide ? (left ? W * .66 : W * .34) : (i % 2 ? W * .16 : W * .08), y: s.offsetTop + s.offsetHeight / 2, el: s});
  });
  pts.push({x: W * .5, y: arrival.offsetTop + 16});
  var d = "M" + pts[0].x + " " + pts[0].y;
  for (var i = 1; i < pts.length; i++){
    var a = pts[i - 1], b = pts[i], m = (a.y + b.y) / 2;
    d += " C" + a.x + " " + m + "," + b.x + " " + m + "," + b.x + " " + b.y;
  }
  route.setAttribute("d", d); trail.setAttribute("d", d); total = route.getTotalLength();
  dots.innerHTML = "";
  pts.forEach(function(p, i){
    if (i === 0 || i === pts.length - 1) { p.dot = null; return; }
    var c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("class", "dot"); c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", 9);
    dots.appendChild(c); p.dot = c;
    if (wide) { var left = p.el.classList.contains("l"), g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", "land"); g.setAttribute("transform", "translate(" + (left ? p.x + 70 : p.x - 190) + "," + (p.y - 30) + ")");
      g.innerHTML = LAND[i % 2]; dots.appendChild(g); }
  });
  update();
}

var SKY = [[0,"#f7b8a0","#ffe3b8"],[.3,"#6fb3ea","#d6efff"],[.65,"#5b3a8c","#ff8a5b"],[1,"#0f1235","#3a2a6e"]];
function hex(h){ return [1,3,5].map(function(i){ return parseInt(h.substr(i,2),16); }); }
function mix(a, b, t){ var x = hex(a), y = hex(b); return "rgb(" + x.map(function(v,i){ return Math.round(v + (y[i]-v)*t); }).join(",") + ")"; }
function sky(s){
  for (var i = 1; i < SKY.length; i++){
    if (s <= SKY[i][0]){
      var a = SKY[i-1], b = SKY[i], t = (s - a[0]) / (b[0] - a[0]);
      document.documentElement.style.setProperty("--sky-top", mix(a[1], b[1], t));
      document.documentElement.style.setProperty("--sky-bot", mix(a[2], b[2], t));
      return;
    }
  }
}
var starsEl = $("stars");
for (var k = 0; k < 70; k++){ var st = document.createElement("i"); st.style.left = Math.random()*100 + "%"; st.style.top = Math.random()*100 + "%"; st.style.animationDelay = (Math.random()*3) + "s"; starsEl.appendChild(st); }

function update(){
  if (!total) return;
  var vh = innerHeight, top = journey.getBoundingClientRect().top + scrollY;
  var y = Math.max(0, Math.min(H, scrollY + vh * .55 - top));
  var lo = 0, hi = total;
  for (var n = 0; n < 22; n++){ var mid = (lo + hi) / 2; if (route.getPointAtLength(mid).y < y) lo = mid; else hi = mid; }
  var p = route.getPointAtLength(lo), p1 = route.getPointAtLength(Math.max(0, lo - 3)), p2 = route.getPointAtLength(Math.min(total, lo + 3));
  var ang = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;
  ang = Math.max(30, Math.min(150, ang));
  plane.setAttribute("transform", "translate(" + p.x + "," + p.y + ") rotate(" + ang + ")");
  trail.style.strokeDasharray = lo + " " + total;
  pts.forEach(function(q){
    if (q.el && y >= q.y - vh * .22) q.el.classList.add("in");
    if (q.dot){ var on = y >= q.y; q.dot.classList.toggle("lit", on);
      if (on && !q.ring){ q.ring = 1; var r = document.createElementNS("http://www.w3.org/2000/svg", "circle"); r.setAttribute("class", "ring"); r.setAttribute("cx", q.x); r.setAttribute("cy", q.y); r.setAttribute("r", 9); dots.appendChild(r); } }
  });
  var s = Math.max(0, Math.min(1, scrollY / Math.max(1, document.documentElement.scrollHeight - vh)));
  sky(s);
  var o = $("orb"), oc = mix("#ffd27a", "#f4f2ff", Math.max(0, Math.min(1, (s - .6) / .25)));
  o.style.left = (8 + 78 * s) + "%"; o.style.top = (62 - Math.sin(Math.PI * s) * 50) + "%"; o.style.background = oc;
  o.style.boxShadow = "0 0 70px 28px " + oc.replace("rgb", "rgba").replace(")", ",.45)");
  $("band").style.opacity = Math.max(0, 1 - Math.abs(s - .62) / .22);
  if (!landed && (y >= pts[pts.length - 1].y - 8 || scrollY + vh >= document.documentElement.scrollHeight - 4)) land();
  var t = Math.max(0, Math.min(1, (s - .6) / .28));
  starsEl.style.opacity = t;
  $("c1").style.transform = "translateX(" + (scrollY * .06) + "px)";
  $("c2").style.transform = "translateX(" + (-scrollY * .05) + "px)";
  $("c3").style.transform = "translateX(" + (scrollY * .03) + "px)";
  [].forEach.call(document.querySelectorAll(".cloud"), function(c){ c.style.opacity = 1 - t; });
}
var landed = false;
function land(){
  landed = true;
  if (typeof confetti === "function") {
    var cols = ["#ff6b4a", "#f4b942", "#7a5cd6", "#ffffff"];
    confetti({particleCount: 110, spread: 80, origin: {y: .6}, colors: cols});
    setTimeout(function(){ confetti({particleCount: 70, angle: 60, spread: 60, origin: {x: 0, y: .7}, colors: cols}); confetti({particleCount: 70, angle: 120, spread: 60, origin: {x: 1, y: .7}, colors: cols}); }, 350);
  }
  var a = $("aText"), msg = CFG.arrivalText;
  a.style.minHeight = a.offsetHeight + "px";
  if (matchMedia("(prefers-reduced-motion:reduce)").matches){ a.style.opacity = 1; return; }
  a.textContent = ""; a.style.opacity = 1;
  var n = 0; (function type(){ a.textContent = msg.slice(0, ++n); if (n < msg.length) setTimeout(type, 38); })();
}
var tick = false;
addEventListener("scroll", function(){ if (!tick){ tick = true; requestAnimationFrame(function(){ tick = false; update(); }); } }, {passive:true});
addEventListener("resize", build);
addEventListener("load", build);
build();

$("rev").addEventListener("click", function(){
  var n = $("next"), on = n.classList.toggle("on");
  this.setAttribute("aria-expanded", on);
  if (on) { if (navigator.vibrate) navigator.vibrate(10); if (typeof confetti === "function") confetti({particleCount: 80, spread: 70, origin: {y: .8}, colors: ["#f4b942", "#ff6b4a", "#7a5cd6"]}); }
  if (on) this.textContent = "Hide it again";
  else this.textContent = "Reveal the next message";
});
